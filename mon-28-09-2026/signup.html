<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="form sign-up">
            <h1>Sign up form</h1>

            <div class="tabs" id="tabs">
                <a href="signup.html" class="btn">Signup</a>
                <a href="login.html" class="btn">Login</a>
            </div>

            <form id="signupForm" class="form-sign-up" novalidate>

                <label for="user-name">Username
                    <input type="text" name="user-name" id="user-name">
                </label>

                <label for="Email">Email
                    <input type="email" name="Email" placeholder="email@gmail.com" id="Email">
                </label>

                <label for="password">Password
                    <input type="password" name="password" id="password">
                </label>

                <label for="conform-pass">Confirm password
                    <input type="password" name="conform-pass" id="conform-pass">
                </label>

                <p id="error" class="error"></p>

                <button type="submit" class="btn sign-btn">Sign up</button>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
